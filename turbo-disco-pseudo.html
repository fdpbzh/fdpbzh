<a class="back" href="turbo-disco.html">‹ retour</a>
<div class="wrap">
  <h1>Qui pilote&nbsp;?</h1>
  <p class="sub">Ton pseudo pour le<br>classement mondial <span class="num">2025</span></p>
  <input id="ps" maxlength="12" placeholder="TON PSEUDO" autocomplete="off" spellcheck="false" autocapitalize="characters">
  <button id="go" disabled>▶ En piste</button>
</div>
<div class="foot">Championnat du Monde Inutile · Pors-Poulhan</div>
<script>
var ps=document.getElementById('ps'), go=document.getElementById('go');
try{var s=(localStorage.getItem('td_name')||'');if(s&&s!=='ANONYME')ps.value=s;}catch(e){}
function sync(){go.disabled=!ps.value.trim();}
ps.addEventListener('input',sync); sync();
setTimeout(function(){try{ps.focus();}catch(e){}},200);
function launch(){
  var n=ps.value.trim(); if(!n)return;
  try{localStorage.setItem('td_name',n.toUpperCase().slice(0,12));}catch(e){}
  location.href='turbo-disco-jeu.html?go=1';
}
go.addEventListener('click',launch);
ps.addEventListener('keydown',function(e){if(e.key==='Enter')launch();});
</script>
