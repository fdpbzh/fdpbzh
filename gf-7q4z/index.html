/* Plein écran portrait. Vu du dessus : le terre-plein, la barquette, le goéland, les crabes. Le chrono en haut.
   Couleurs 2027 : le couchant « Vice City » du Goéland Oiseau. Pas de boîte : le titre flotte sur la scène,
   le bas de l'écran s'assombrit juste assez pour lire, et un gros bouton autocollant. Un seul thème, par choix. */
:root{

  --bg:#26146e; --panel:transparent; --line:#7c269e; --ink:#fff6fb; --mute:#ffd6e8; --hot:#ff3e8c; --hot-dk:#26146e;

  --f-script:"Yellowtail", "Brush Script MT", cursive;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none}
.stage{container-type:inline-size;position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
/* le bas de l'écran se couvre d'un voile du couchant, seulement à l'accueil et à l'arrivée */
.scrim{position:absolute;inset:auto 0 0 0;height:52%;pointer-events:none;opacity:0;transition:opacity .35s;
  background:linear-gradient(to top,rgba(38,20,110,.92) 0%,rgba(38,20,110,.72) 38%,rgba(124,38,158,.28) 72%,rgba(124,38,158,0) 100%)}
.stage[data-ui="menu"] .scrim,.stage[data-ui="over"] .scrim{opacity:1}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:12px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;font-size:11px;font-size:clamp(10px,2.9cqw,16px)}

/* en course : le chrono, et les frites qui restent */
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.time{font-size:2.8em;line-height:1.3;color:#fff;font-variant-numeric:tabular-nums;text-shadow:-2px 0 0 var(--out),0 -2px 0 var(--out),2px 0 0 var(--out),0 2px 0 var(--out),4px 4px 0 var(--hot)}
.left{text-align:right;font-size:1.8em;line-height:1.35;color:var(--gold);text-shadow:-2px 0 0 var(--out),0 -2px 0 var(--out),2px 0 0 var(--out),0 2px 0 var(--out),3px 3px 0 var(--orange)}
.left small{display:block;font-size:.4em;letter-spacing:.12em;color:#fff;text-shadow:2px 2px 0 var(--out)}

/* le titre : GOÉLAND en lettres de couchant, « vitesse » en néon turquoise, de travers */
.title{font-size:1em;margin:max(calc(10vh + 56px),23vh) 0 0;display:flex;flex-direction:column;align-items:center;font-weight:400;line-height:1;text-align:center}
.t1{font-size:3.75em;letter-spacing:.02em;color:#ffb03a;background:var(--sunset);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;

.t2{position:relative;font-family:var(--f-script);font-size:5.2em;line-height:.9;margin:-.32em 0 0 1.4em;transform:rotate(-8deg);color:#effffe;
  text-shadow:0 0 3px var(--cyan),0 0 12px var(--cyan),0 0 26px rgba(79,232,226,.7),3px 3px 0 var(--out)}

.panel p{margin:0}

.verdict b{font-weight:400;color:var(--cyan)}
.verdict.new{color:var(--gold)}
.big{font-size:3.6em;line-height:1.15;color:#ffb03a;background:var(--sunset);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;

.stats dt{font-size:.6em;line-height:1.5;color:var(--cyan);text-shadow:1px 1px 0 var(--out)}

.play{appearance:none;background:none;border:0;padding:0;cursor:pointer;min-width:min(80%,20em);font-family:var(--f);font-size:1.5em;color:#fff;
  filter:drop-shadow(0 5px 0 #120a3a)}

.in::before{content:"";width:0;height:0;border-style:solid;border-width:.45em 0 .45em .6em;border-color:transparent transparent transparent var(--gold);filter:drop-shadow(2px 2px 0 var(--out))}

.play:disabled{opacity:.5}

.share{appearance:none;background:none;border:0;cursor:pointer;font-family:var(--f);font-size:1em;letter-spacing:.08em;color:var(--cyan);text-shadow:2px 2px 0 var(--out);padding:12px 18px;min-height:44px}
.share:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.links{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:-8px}
.testtag{font-size:.7em;letter-spacing:.1em;color:var(--gold);text-shadow:2px 2px 0 var(--out)}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.78em;line-height:1.6;text-shadow:2px 2px 0 var(--out)}
.rec ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto minmax(0,auto) auto;gap:4px 14px;align-items:baseline}
.rec li{display:contents}.rec .rk{color:var(--cyan);text-align:right}.rec .nm{color:#fff;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .tm{color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.rec li:first-child>span{font-size:1.2em}
@media (max-height:720px){.title{margin-top:calc(10vh + 52px)}.panel{gap:10px}.links{margin-top:-4px}.testtag{display:none!important}}
.turn{display:none}
@media (orientation:landscape) and (max-height:520px){.turn{display:flex;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;background:rgba(22,10,58,.94);color:#fff;text-align:center;font-size:1.4em;line-height:1.8;text-shadow:3px 3px 0 var(--out)}}
.wait{display:block;font-size:max(7px,.62em);line-height:1.5;letter-spacing:.06em;color:var(--hot);white-space:normal}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:34em;font-size:.78em;line-height:1.7;text-shadow:2px 2px 0 var(--out);color:#fff}
.contact p{margin:0}.contact .ct-h{color:var(--gold);font-size:1.15em}.contact .ct-s{font-size:.75em;color:var(--mute)}.contact .ct-ok{color:var(--cyan)}

.pseudo{appearance:none;box-sizing:border-box;width:min(80%,20em);font-family:var(--f);font-size:1.15em;letter-spacing:.06em;text-align:center;text-transform:uppercase;color:#fff;padding:12px 10px;

  padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

</div>

      if ((state === 'menu' || state === 'over') && !$('panel').hidden && clock - capT > 0.4) {      // la place libre entre le titre et le panneau
        capT = clock; var sr = stage.getBoundingClientRect(), pr = $('panel').getBoundingClientRect(), u = dpr / NPX, lo = QY + WH + TH * SC / 2 + 22;
        if (!$('title').hidden) lo = Math.max(lo, ($('title').getBoundingClientRect().bottom - sr.top) * u + TH * SC / 2 + 6);
        capV = Math.max(lo, (pr.top - sr.top) * u - TH * SC / 2 - 12);
      }
      var capY = capV != null ? Math.min(zone.y1, capV) : zone.y1;
      if (state === 'menu' && T.y > capY) { var dyc = capY - T.y; T.y += dyc; B.y += dyc; }       // à l'accueil, le goéland et sa barquette se posent d'emblée dans la place libre
      if (state === 'over' && T.y > capY) T.y += (capY - T.y) * Math.min(1, 3 * dt);               // à l'arrivée, la barquette remonte au-dessus du panneau
    }
    if (state === 'over' && leave) {                                               // repu, il tourne le dos à la barquette et s'en va en dandinant
      leave.t += dt;
      if (leave.t > 1.6) {
        if (!leave.go) { leave.go = true; B = { x: B.x, y: B.y, a: B.a, step: B.step }; leave.dir = (B.x <= T.x ? Math.PI : 0) + (Math.random() - 0.5) * 0.5; }
        var lda = wrapA(leave.dir - B.a); B.a += lda * Math.min(1, 4 * dt);
        var lsp = Math.abs(lda) < 1.2 ? 95 * (1 - Math.abs(lda) / 1.2 * 0.7) : 12;
        B.x += Math.cos(B.a) * lsp * dt; B.y += Math.sin(B.a) * lsp * dt; B.step += lsp * dt * 0.9 / SC;
        if (B.x < -95 || B.x > PW + 95) { gone = true; leave = null; startFeast(); }
      }
    }
    peckT += dt; peck = peckT < 0.05 ? peckT / 0.05 : Math.max(0, 1 - (peckT - 0.05) / 0.09);
    blinkT -= dt; if (blinkT < -0.12) blinkT = 1.5 + Math.random() * 3;
    if (state === 'menu' || state === 'over') look += ((Math.sin(clock * 0.9) > 0.3 ? 1 : Math.sin(clock * 0.9) < -0.3 ? -1 : 0) - look) * Math.min(1, 6 * dt);
    else look *= 0.8;
    if (state === 'menu' && Math.sin(clock * 1.7) > 0.97 && peckT > 0.6) { peckT = 0; }   // à l'accueil, il picore de temps en temps

    g.imageSmoothingEnabled = false;
    if (groundC) g.drawImage(groundC, 0, 0);
    drawSea(dt); updCrabs(dt);
    lightBack();                                                                   // la nuit tombe sur le décor ; crabes, barquette et goéland restent plus lisibles
    drawCrabs();
    drawTray(T.x, T.y, T.a);
    for (var i = flying.length - 1; i >= 0; i--) {                                 // la frite gobée file vers le bec
      var f = flying[i]; f.t += dt; if (f.t > 0.1) { flying.splice(i, 1); continue; }
      var hx = B.x + Math.cos(B.a) * 19 * SC * GS, hy = B.y + Math.sin(B.a) * 19 * SC * GS, k = f.t / 0.1, fx = f.x + (hx - f.x) * k, fy = f.y + (hy - f.y) * k;
      for (var kk = 0; kk < 8; kk++) { g.fillStyle = kk < 2 || kk > 5 ? '#d99a2a' : '#ffd23f'; g.fillRect(Math.round(fx + Math.cos(f.a) * (kk - 4)), Math.round(fy + Math.sin(f.a) * (kk - 4)), 2, 2); }
    }
    if (enter) {                                                                   // il revient en trottinant pour la partie suivante (dessin seul, la partie ne l'attend pas)
      enter.t += dt; var ek = Math.min(1, enter.t / 0.55), ee = 1 - (1 - ek) * (1 - ek), exx = enter.x + (B.x - enter.x) * ee, eyy = enter.y + (B.y - enter.y) * ee;
      var ea = ek < 0.75 ? Math.atan2(B.y - enter.y, B.x - enter.x) : B.a;
      drawGull(exx, eyy, ea, { neck: peck, beak: peck > 0.25 ? peck : 0, look: 0, step: B.step + enter.t * 14, blink: 0 }, true);
      if (ek >= 1) enter = null;
    } else if (!gone) drawGull(B.x, B.y, B.a, { neck: peck, beak: peck > 0.25 ? peck : 0, look: leave && leave.go ? 0 : look, step: B.step, blink: blinkT < 0 ? 1 : 0 }, true);
    for (i = crumbs.length - 1; i >= 0; i--) {                                     // les miettes, et les taps à côté
      var c = crumbs[i]; c.t += dt; if (c.t > (c.miss ? 0.3 : 0.4)) { crumbs.splice(i, 1); continue; }
      if (c.miss) { var rr = (3 + c.t * 30) * SC; g.fillStyle = 'rgba(255,84,112,' + (1 - c.t / 0.3).toFixed(2) + ')'; for (var a = 0; a < 12; a++) g.fillRect(Math.round(c.x + Math.cos(a / 12 * TAU) * rr), Math.round(c.y + Math.sin(a / 12 * TAU) * rr), 1, 1); continue; }
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.9; c.vy *= 0.9;
      g.fillStyle = '#e8b54a'; g.fillRect(Math.round(c.x), Math.round(c.y), 2, 2);
    }
    lightFront(); nightPost();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pc, 0, 0, PW * NPX, PH * NPX);
    if (pens.length) {                                                             // « +0,2 » : ce que coûte un tap à côté
      ctx.font = Math.round(W / 24) + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      for (i = pens.length - 1; i >= 0; i--) {
        var pn = pens[i]; pn.t += dt; if (pn.t > 0.6) { pens.splice(i, 1); continue; }
        var pxp = clamp(pn.x * NPX, W * 0.12, W * 0.88), pyp = (pn.y - 8 - pn.t * 22) * NPX; ctx.globalAlpha = Math.min(1, (0.6 - pn.t) * 4);
        ctx.fillStyle = OUT; ctx.fillText('+' + fr(GVSIM.PEN / 1000, 1), pxp + 2, pyp + 2); ctx.fillStyle = '#ff5470'; ctx.fillText('+' + fr(GVSIM.PEN / 1000, 1), pxp, pyp);
      }
      ctx.globalAlpha = 1;
    }
    if (burp > 0) {                                                                // BURP
      burp = Math.max(0, burp - dt * 0.6);
      ctx.font = Math.round(W / 14) + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      var bxp = clamp((B.x + Math.cos(B.a) * 20 * SC * GS) * NPX, W * 0.2, W * 0.8), byp = (B.y - 22 * SC) * NPX - (1 - burp) * W * 0.08;
      ctx.globalAlpha = Math.min(1, burp * 2); ctx.fillStyle = OUT; ctx.fillText('BURP !', bxp + 3, byp + 3); ctx.fillStyle = '#ffd05a'; ctx.fillText('BURP !', bxp, byp); ctx.globalAlpha = 1;
    }
    if (warnT > 0 && state === 'run') {                                           // le rappel de la règle, quand un tap est refusé
      warnT -= dt;
      ctx.font = Math.round(W / 24) + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      var wy = (T.y - 34 * SC) * NPX; ctx.globalAlpha = Math.min(1, warnT * 3);
      var wt = penalty ? 'UN SEUL DOIGT ! +' + penalty : 'UN SEUL DOIGT !';
      ctx.fillStyle = OUT; ctx.fillText(wt, W / 2 + 2, wy + 2); ctx.fillStyle = '#4fe8e2'; ctx.fillText(wt, W / 2, wy); ctx.globalAlpha = 1;
      if (warnT <= 0) penalty = 0;
    }
  }
  function start() {
    applyPal(); resize(); setUi('menu');
    $('pseudo').value = myName; $('testtag').hidden = GRP !== 'test';
    if (!TOUCH) { $('pseudo').hidden = true; $('play').hidden = true; $('verdict').innerHTML = 'ÇA SE JOUE AU DOIGT.<br>OUVRE-LE SUR TON TÉLÉPHONE.'; $('verdict').hidden = false; }
    prefetch(); loadBoard();
    last = performance.now(); requestAnimationFrame(frame);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
