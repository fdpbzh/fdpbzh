<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#26146e">
<title>Goéland et Frites</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Yellowtail&display=swap">
<style>
/* Plein écran portrait. Vu du dessus : le terre-plein, la barquette, le goéland, les crabes. Le chrono en haut.
   Couleurs 2027 : le couchant « Vice City » du Goéland Oiseau. Pas de boîte : le titre flotte sur la scène,
   le bas de l'écran s'assombrit juste assez pour lire, et un gros bouton autocollant. Un seul thème, par choix. */
:root{
  color-scheme: dark;
  --bg:#26146e; --panel:transparent; --line:#7c269e; --ink:#fff6fb; --mute:#ffd6e8; --hot:#ff3e8c; --hot-dk:#26146e;
  --gold:#ffd05a; --cyan:#4fe8e2; --out:#26146e; --onhot:#fff; --glow:rgba(255,62,140,.5);
  --orange:#ff8040; --violet:#7c269e;
  --sunset:linear-gradient(180deg,#ffe27a 0 28%,#ffb03a 28% 50%,#ff5a8a 50% 76%,#d23bc8 76% 100%);
  --f:"Press Start 2P", ui-monospace, Menlo, monospace;
  --f-script:"Yellowtail", "Brush Script MT", cursive;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none}
.stage{container-type:inline-size;position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
/* le bas de l'écran se couvre d'un voile du couchant, seulement à l'accueil et à l'arrivée */
.scrim{position:absolute;inset:auto 0 0 0;height:52%;pointer-events:none;opacity:0;transition:opacity .35s;
  background:linear-gradient(to top,rgba(38,20,110,.92) 0%,rgba(38,20,110,.72) 38%,rgba(124,38,158,.28) 72%,rgba(124,38,158,0) 100%)}
.stage[data-ui="menu"] .scrim,.stage[data-ui="over"] .scrim{opacity:1}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:12px max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;font-size:11px;font-size:clamp(10px,2.9cqw,16px)}

/* en course : le chrono, et les frites qui restent */
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.time{font-size:2.8em;line-height:1.3;color:#fff;font-variant-numeric:tabular-nums;text-shadow:-2px 0 0 var(--out),0 -2px 0 var(--out),2px 0 0 var(--out),0 2px 0 var(--out),4px 4px 0 var(--hot)}
.left{text-align:right;font-size:1.8em;line-height:1.35;color:var(--gold);text-shadow:-2px 0 0 var(--out),0 -2px 0 var(--out),2px 0 0 var(--out),0 2px 0 var(--out),3px 3px 0 var(--orange)}
.left small{display:block;font-size:.4em;letter-spacing:.12em;color:#fff;text-shadow:2px 2px 0 var(--out)}

/* le titre : GOÉLAND en lettres de couchant, « et frites » en néon turquoise, de travers */
.title{font-size:1em;margin:max(2.2em,14vh) 0 0;display:flex;flex-direction:column;align-items:center;font-weight:400;line-height:1;text-align:center}
.t1{font-size:3.3em;letter-spacing:.02em;color:#ffb03a;background:var(--sunset);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(3px 3px 0 var(--out)) drop-shadow(2px 2px 0 var(--out)) drop-shadow(0 0 14px rgba(255,62,140,.55))}
.t2{font-family:var(--f-script);font-size:5.2em;line-height:.9;margin:-.05em 0 0 1.4em;transform:rotate(-8deg);color:#effffe;
  text-shadow:0 0 3px var(--cyan),0 0 12px var(--cyan),0 0 26px rgba(79,232,226,.7),3px 3px 0 var(--out)}

/* le bas : pas de boîte, du texte posé sur le voile */
.panel{pointer-events:auto;touch-action:pan-y;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.panel p{margin:0}
.verdict{max-width:28em;font-size:.95em;line-height:2;color:#fff;text-shadow:2px 2px 0 var(--out);text-wrap:balance}
.verdict b{font-weight:400;color:var(--cyan)}
.verdict.new{color:var(--gold)}
.big{font-size:3.6em;line-height:1.15;color:#ffb03a;background:var(--sunset);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(3px 3px 0 var(--out)) drop-shadow(2px 2px 0 var(--out));font-variant-numeric:tabular-nums}
.big small{font-size:.35em;margin-left:6px}
.stats{margin:0;width:100%;max-width:30em;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{min-width:0;display:flex;flex-direction:column-reverse;align-items:center;gap:6px}
.stats dt{font-size:.6em;line-height:1.5;color:var(--cyan);text-shadow:1px 1px 0 var(--out)}
.stats dd{margin:0;font-size:1.05em;line-height:1.3;color:#fff;text-shadow:2px 2px 0 var(--out);font-variant-numeric:tabular-nums;white-space:nowrap}
/* le bouton : une plaque de borne d'arcade. Coins en escalier, aplats, lettres aux couleurs du score, curseur qui clignote */
.play{appearance:none;background:none;border:0;padding:0;cursor:pointer;min-width:min(80%,20em);font-family:var(--f);font-size:1.5em;color:#fff;
  filter:drop-shadow(0 5px 0 #120a3a)}
.px{--st:4px;clip-path:polygon(0 calc(var(--st)*2),var(--st) calc(var(--st)*2),var(--st) var(--st),calc(var(--st)*2) var(--st),calc(var(--st)*2) 0,calc(100% - var(--st)*2) 0,calc(100% - var(--st)*2) var(--st),calc(100% - var(--st)) var(--st),calc(100% - var(--st)) calc(var(--st)*2),100% calc(var(--st)*2),100% calc(100% - var(--st)*2),calc(100% - var(--st)) calc(100% - var(--st)*2),calc(100% - var(--st)) calc(100% - var(--st)),calc(100% - var(--st)*2) calc(100% - var(--st)),calc(100% - var(--st)*2) 100%,calc(var(--st)*2) 100%,calc(var(--st)*2) calc(100% - var(--st)),var(--st) calc(100% - var(--st)),var(--st) calc(100% - var(--st)*2),0 calc(100% - var(--st)*2))}
.plate{display:block;padding:3px;background:var(--out)}
.ring{display:block;padding:3px;background:var(--hot)}
.in{display:flex;align-items:center;justify-content:center;gap:.7em;min-height:52px;padding:12px 22px;background:linear-gradient(180deg,#4a2aa8 0 4px,#2d1677 4px calc(100% - 4px),#1d0e57 calc(100% - 4px))}
.in::before{content:"";width:0;height:0;border-style:solid;border-width:.45em 0 .45em .6em;border-color:transparent transparent transparent var(--gold);filter:drop-shadow(2px 2px 0 var(--out))}
.lbl{color:#ffb03a;background:var(--sunset);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 2px 0 #120a3a);letter-spacing:.06em;line-height:1.2}
.play:active{filter:drop-shadow(0 1px 0 #120a3a);transform:translateY(4px)}
.play:disabled{opacity:.5}
.play:focus-visible{outline:3px solid var(--cyan);outline-offset:6px}
@media (prefers-reduced-motion:no-preference){.play:not(:disabled) .in::before{animation:blink 1s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}
</style>
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="stage" id="stage" data-ui="menu">
  <canvas id="cv" aria-label="Le terre-plein vu du dessus : tape dans la barquette pour que le goéland mange les frites"></canvas>
  <div class="scrim"></div>
  <div class="ui">
    <div class="hud" id="hud" hidden>
      <div class="time" id="time">0,000</div>
      <div class="left"><span id="left">50</span><small>FRITES</small></div>
    </div>
    <h1 class="title" id="title"><span class="t1">GOÉLAND</span><span class="t2">et frites</span></h1>
    <section class="panel" id="panel" aria-live="polite">
      <p class="big" id="big" hidden></p>
      <dl class="stats" id="stats" hidden></dl>
      <p class="verdict" id="verdict">50 FRITES. TAPE DANS LA BARQUETTE : À CHAQUE TAP, IL EN GOBE UNE. LE CHRONO PART AU PREMIER COUP DE BEC.</p>
      <button class="play" id="play" type="button"><span class="plate px"><span class="ring px"><span class="in px"><span class="lbl" id="playLbl">À TABLE</span></span></span></span></button>
    </section>
  </div>
</div>

      var au = Math.abs(u), av = Math.abs(v);
      if (au > TW / 2 || av > TH / 2) return null;
      if (au > TW / 2 - 0.5 || av > TH / 2 - 0.5) return OUT;
      if (au > TW / 2 - 3 || av > TH / 2 - 3) {                                 // le rebord, rayé de rouge
        if (av > TH / 2 - 3 && Math.floor((u + 40) / 4) % 2 === 0) return '#e23a2e';
        if (au > TW / 2 - 3 && Math.floor((v + 40) / 4) % 2 === 0) return '#e23a2e';
        return u + v < 0 ? '#ffffff' : '#f1e8d8';
      }
      if (av > TH / 2 - 4) return '#cbbfa8';                                    // l'ombre du rebord, dedans
      return '#e9dcc4';
    };
    g.fillStyle = 'rgba(40,24,70,' + (TS ? TS.sh : 0.3) + ')';
    for (y = -R0; y <= R0; y++) for (x = -R0; x <= R0; x++) { u = (x * ca + y * sa) / SC; v = (-x * sa + y * ca) / SC; if (trayAt(u, v)) g.fillRect(ix + x + 3 * SC, iy + y + 4 * SC, 1, 1); }
    for (y = -R0; y <= R0; y++) for (x = -R0; x <= R0; x++) { u = (x * ca + y * sa) / SC; v = (-x * sa + y * ca) / SC; col = trayAt(u, v); if (col) { g.fillStyle = col; g.fillRect(ix + x, iy + y, 1, 1); } }
    /* le ketchup, dans un coin */
    for (y = -6; y <= 6; y++) for (x = -8; x <= 8; x++) if (x * x / 64 + y * y / 36 < 1 - 0.15 * Math.sin(x * 1.3 + y)) { u = 11 * SC + x; v = -6 * SC + y; g.fillStyle = x + y < -6 ? '#ff8a7a' : x + y < 2 ? '#e8362c' : '#b81e1c'; g.fillRect(Math.round(ix + u * ca - v * sa), Math.round(iy + u * sa + v * ca), 1, 1); }
    /* les frites */
    for (i = 0; i < fries.length; i++) {
      f = fries[i]; if (!f.on) continue;
      var fa = ang + f.a, fc = Math.cos(fa), fs = Math.sin(fa), bx = ix + (f.x * ca - f.y * sa) * SC, by = iy + (f.x * sa + f.y * ca) * SC, L = f.l * SC;
      for (k = 0; k < L; k++) {                    // le liseré brun de la frite
        var px = Math.round(bx + (k - L / 2) * fc), py = Math.round(by + (k - L / 2) * fs);
        g.fillStyle = '#7a4a10'; g.fillRect(px - 1, py - 1, 4, 4);
      }
      for (k = 0; k < L; k++) {                    // la frite : dorée, plus claire sur le dessus, bouts plus cuits
        var qx = Math.round(bx + (k - L / 2) * fc), qy = Math.round(by + (k - L / 2) * fs);
        g.fillStyle = k < 2 || k > L - 3 ? '#d99a2a' : f.z > 0.5 ? '#ffe27a' : '#ffd23f'; g.fillRect(qx, qy, 2, 2);
        if (k > 1 && k < L - 2 && k % 3) { g.fillStyle = '#fff3b8'; g.fillRect(qx, qy, 1, 1); }
      }
    }
  }

  /* ---------- l'état de la scène ---------- */
  var toss = null, T = { x: 0, y: 0, vx: 0, vy: 0, a: 0, va: 0 }, B = { x: 0, y: 0, a: 0, step: 0 }, peck = 0, peckT = 9, blinkT = 0, look = 0, flying = [], crumbs = [], burp = 0;
  var zone = { x0: 0, y0: 0, x1: 0, y1: 0 };
  function setZone() { zone = { x0: 22 * SC, y0: Math.round(PH * 0.1) + WH + 18 * SC, x1: PW - 22 * SC, y1: Math.round(PH * (state === 'menu' || state === 'over' ? 0.7 : 0.88)) }; }
  function reset() {
    setZone(); makeFries();
    T.x = PW * 0.72; T.y = (zone.y0 + zone.y1) / 2; T.vx = T.vy = 0; T.a = -0.1; T.va = 0;
    B.x = T.x - (23.6 * GS + 4.4) * SC; B.y = T.y + 6; B.a = 0; flying = []; crumbs = []; burp = 0; peckT = 9; toss = null;
  }
  function resize() {
    dpr = Math.min(3, window.devicePixelRatio || 1);
    var r = stage.getBoundingClientRect();
    W = cv.width = Math.max(2, Math.round(r.width * dpr)); H = cv.height = Math.max(2, Math.round(r.height * dpr));
    NPX = Math.max(1, Math.round(W / 220));
    PW = pc.width = Math.ceil(W / NPX); PH = pc.height = Math.ceil(H / NPX);
    groundC = makeGround(); setZone(); makeLight();
    if (!fries.length) reset();
    makeCrabs(); hitT = []; wet = []; spray = [];
  }
  window.addEventListener('resize', resize);

  function setUi(p) { stage.dataset.ui = p; $('panel').hidden = p !== 'menu' && p !== 'over'; $('title').hidden = p !== 'menu'; $('hud').hidden = p === 'menu'; }
  $('play').addEventListener('click', function () {
    audio(); state = 'ready'; hits = []; misses = 0; down = {}; maxDown = 0; refused = 0; warnT = 0; lastHit = -1e9; F1 = { h: [], zz: 0, two: false, G: null, X: null, lastX: 0 }; reset(); setUi('ready');
    $('left').textContent = N; $('time').textContent = '0,000';
  });

  /* ---------- un coup de bec ---------- */
  function strike(tt) {
    var left = fries.filter(function (f) { return f.on; }), f = left[Math.floor(Math.random() * left.length)];
    f.on = false;
    var ca = Math.cos(T.a), sa = Math.sin(T.a);
    if (hits.length >= N) toss = { t: 0, l: f.l, spin: (Math.random() < 0.5 ? -1 : 1) * (9 + Math.random() * 5), snd: 0 };   // la dernière : il la jette en l'air
    else flying.push({ x: T.x + (f.x * ca - f.y * sa) * SC, y: T.y + (f.x * sa + f.y * ca) * SC, a: T.a + f.a, l: f.l, t: 0, tx: 0, ty: 0 });
    for (var k = 0; k < 4; k++) crumbs.push({ x: T.x + (Math.random() - 0.5) * 20 * SC, y: T.y + (Math.random() - 0.5) * 12 * SC, vx: (Math.random() - 0.5) * 70 * SC, vy: (Math.random() - 0.5) * 70 * SC, t: 0 });
    var ang = Math.atan2(T.y - B.y, T.x - B.x) + (Math.random() - 0.5) * 2.4, pw = (55 + Math.random() * 70) * SC * (toss ? 0.3 : 1);   // la tête pousse la barquette, un peu au hasard
    T.vx += Math.cos(ang) * pw; T.vy += Math.sin(ang) * pw; T.va += (Math.random() - 0.5) * 6;
    peck = 1; peckT = 0; scarePeck();
    tone(260 + Math.random() * 60, 120, 0.05, 'square', 0.05); tone(900, 1400, 0.03, 'triangle', 0.03, 0.04);
  }
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.panel')) return;
    if (state !== 'ready' && state !== 'run') return;
    e.preventDefault();
    var tt = performance.now(), r = stage.getBoundingClientRect(), px = (e.clientX - r.left) * dpr / NPX, py = (e.clientY - r.top) * dpr / NPX;
    var dx = px - T.x, dy = py - T.y, ca = Math.cos(-T.a), sa = Math.sin(-T.a), u = dx * ca - dy * sa, v = dx * sa + dy * ca;
    var inside = Math.abs(u) < (TW / 2 + 5) * SC && Math.abs(v) < (TH / 2 + 5) * SC;          // la barquette, avec un peu de marge pour le doigt
    if (!inside) { if (state === 'run') misses++; crumbs.push({ x: px, y: py, vx: 0, vy: 0, t: 0, miss: true }); return; }
    if (!oneFinger(e, tt, (e.clientX - r.left) - T.x * NPX / dpr, (e.clientY - r.top) - T.y * NPX / dpr)) { refused++; warnT = 0.9; return; }
    if (state === 'ready') { state = 'run'; t0 = tt; }
    lastHit = tt;
    hits.push({ t: tt - t0 });
    strike(tt);
    $('left').textContent = N - hits.length;
    if (hits.length >= N) finish();
  }, { passive: false });
  /* ---------- un seul doigt ----------
     1) un doigt qui se pose alors qu'un autre touche encore la vitre ne compte pas ;
     2) deux coups de bec comptés sont séparés d'au moins 80 ms (plus de 12 par seconde, aucun doigt seul ne suit une barquette qui bouge) ;
     3) deux doigts qui alternent sans se chevaucher tapent en zigzag : un coup ici, un coup à un centimètre, un coup ici…
        Dès que ce zigzag se répète, on reconnaît les deux doigts (par leur place par rapport à la barquette) et seul celui
        qui tape le plus près du milieu de la barquette compte. Les positions sont en pixels CSS : 1 cm ≈ 38 px. */
  var F1 = { h: [], zz: 0, two: false, G: null, X: null, lastX: 0 }, NEAR = 14, FAR = 26;
  function oneFinger(e, tt, rx, ry) {
    var others = Object.keys(down).filter(function (k) { return +k !== e.pointerId; }).length;
    var h = F1.h; h.push([rx, ry]); if (h.length > 3) h.shift();
    if (h.length === 3) {
      var a = h[0], b = h[1], c = h[2], dAC = Math.hypot(a[0] - c[0], a[1] - c[1]), dAB = Math.hypot(a[0] - b[0], a[1] - b[1]), dBC = Math.hypot(b[0] - c[0], b[1] - c[1]);
      if (dAC < NEAR && dAB > FAR && dBC > FAR) F1.zz++; else F1.zz = Math.max(0, F1.zz - 1);
      if (!F1.two && F1.zz >= 3) {
        var P = [(a[0] + c[0]) / 2, (a[1] + c[1]) / 2], Q = b;
        F1.two = true; F1.lastX = tt;
        if (Math.hypot(P[0], P[1]) <= Math.hypot(Q[0], Q[1])) { F1.G = P; F1.X = Q; } else { F1.G = Q; F1.X = P; }   // le doigt gardé : le plus près du milieu
      }
    }
    if (F1.two && tt - F1.lastX > 1200) { F1.two = false; F1.zz = 0; }
    if (others > 0) return false;
    if (F1.two) {
      var dG = Math.hypot(rx - F1.G[0], ry - F1.G[1]), dX = Math.hypot(rx - F1.X[0], ry - F1.X[1]);
      if (dX < dG) { F1.X = [F1.X[0] * 0.6 + rx * 0.4, F1.X[1] * 0.6 + ry * 0.4]; F1.lastX = tt; return false; }
      F1.G = [F1.G[0] * 0.6 + rx * 0.4, F1.G[1] * 0.6 + ry * 0.4];
    }
    if (tt - lastHit < 80) return false;
    return true;
  }
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('pointerdown', function (e) { lastDown = performance.now(); down[e.pointerId] = 1; var n = Object.keys(down).length; if (state === 'run' && n > maxDown) maxDown = n; }, true);
  function up(e) { delete down[e.pointerId]; }
  window.addEventListener('pointerup', up, true); window.addEventListener('pointercancel', up, true);

  function finish() {
    state = 'over';                                                                // le rot vient après la frite rattrapée
    var ms = hits[hits.length - 1].t, prev = best, isNew = !best || ms < best;
    if (isNew) { best = ms; store.set('gf_best', best); }
    $('time').textContent = fr(ms / 1000, 3);
    var iv = [], i, m = 0, sd = 0;
    for (i = 1; i < hits.length; i++) iv.push(hits[i].t - hits[i - 1].t);
    for (i = 0; i < iv.length; i++) m += iv[i]; m /= Math.max(1, iv.length);
    for (i = 0; i < iv.length; i++) sd += (iv[i] - m) * (iv[i] - m); sd = Math.sqrt(sd / Math.max(1, iv.length));
    setTimeout(function () {
      var v = $('verdict');
      v.textContent = isNew && prev ? 'NOUVEAU RECORD !' : prev ? 'TON RECORD : ' + fr(prev / 1000, 3) + ' S' : 'PREMIER CHRONO';
      v.classList.toggle('new', isNew && !!prev);
      $('big').innerHTML = fr(ms / 1000, 3) + '<small>S</small>'; $('big').hidden = false;
      var rows = [['CADENCE', fr(N / (ms / 1000), 1) + ' /S'], ['RATÉS', String(misses)], ['RÉGULARITÉ', fr(m ? sd / m * 100 : 0, 0) + ' %'], ['REFUSÉS', String(refused)]];
      $('stats').innerHTML = rows.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join(''); $('stats').hidden = false;
      $('playLbl').textContent = 'REJOUER'; $('play').disabled = true; setUi('over'); setZone();
      var shown = performance.now();
      (function arm() { var n2 = performance.now(); if (n2 - shown > 400 && n2 - lastDown > 400) $('play').disabled = false; else setTimeout(arm, 60); })();
    }, 2100);
  }

  /* ---------- la boucle ---------- */
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; clock += dt;
    if (state === 'run') $('time').textContent = fr((ts - t0) / 1000, 3);
    /* la barquette glisse, freinée par le béton, et rebondit sur les bords */
    var fk = Math.exp(-4.2 * dt);
    T.vx *= fk; T.vy *= fk; T.va *= Math.exp(-5 * dt);
    T.x += T.vx * dt; T.y += T.vy * dt; T.a += T.va * dt;
    if (T.x < zone.x0) { T.x = zone.x0; T.vx = Math.abs(T.vx) * 0.6; } if (T.x > zone.x1) { T.x = zone.x1; T.vx = -Math.abs(T.vx) * 0.6; }
    if (T.y < zone.y0) { T.y = zone.y0; T.vy = Math.abs(T.vy) * 0.6; } if (T.y > zone.y1) { T.y = zone.y1; T.vy = -Math.abs(T.vy) * 0.6; }
    if (state === 'menu') { T.x += (PW * 0.72 - T.x) * dt; T.y += ((zone.y0 + zone.y1) / 2 - T.y) * dt; }
    /* le goéland la suit : il se place pour que sa tête tombe dessus, se tourne vers elle, et trottine */
    var dx = T.x - B.x, dy = T.y - B.y, dist = Math.hypot(dx, dy), want = (23.6 * GS + 3.4) * SC, aim = Math.atan2(dy, dx), da = aim - B.a;
    while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    B.a += da * Math.min(1, 12 * dt);
    var mv = (dist - want) * Math.min(1, 9 * dt);
    if (Math.abs(dist - want) > 0.5) { B.x += dx / dist * mv; B.y += dy / dist * mv; B.step += Math.abs(mv) * 0.9 / SC; }
    peckT += dt; peck = peckT < 0.05 ? peckT / 0.05 : Math.max(0, 1 - (peckT - 0.05) / 0.09);
    blinkT -= dt; if (blinkT < -0.12) blinkT = 1.5 + Math.random() * 3;
    if (state === 'menu' || state === 'over') look += ((Math.sin(clock * 0.9) > 0.3 ? 1 : Math.sin(clock * 0.9) < -0.3 ? -1 : 0) - look) * Math.min(1, 6 * dt);
    else look *= 0.8;
    if (state === 'menu' && Math.sin(clock * 1.7) > 0.97 && peckT > 0.6) { peckT = 0; }   // à l'accueil, il picore de temps en temps

    g.imageSmoothingEnabled = false;
    if (groundC) g.drawImage(groundC, 0, 0);
    drawSea(dt); updCrabs(dt);
    lightBack();                                                                   // la nuit tombe sur le décor ; crabes, barquette et goéland restent plus lisibles
    drawCrabs();
    drawTray(T.x, T.y, T.a);
    for (var i = flying.length - 1; i >= 0; i--) {                                 // la frite gobée file vers le bec
      var f = flying[i]; f.t += dt; if (f.t > 0.1) { flying.splice(i, 1); continue; }
      var hx = B.x + Math.cos(B.a) * 19 * SC * GS, hy = B.y + Math.sin(B.a) * 19 * SC * GS, k = f.t / 0.1, fx = f.x + (hx - f.x) * k, fy = f.y + (hy - f.y) * k;
      for (var kk = 0; kk < 8; kk++) { g.fillStyle = kk < 2 || kk > 5 ? '#d99a2a' : '#ffd23f'; g.fillRect(Math.round(fx + Math.cos(f.a) * (kk - 4)), Math.round(fy + Math.sin(f.a) * (kk - 4)), 2, 2); }
    }
    var GP = { neck: peck, beak: peck > 0.25 ? peck : 0, look: look, step: B.step, blink: blinkT < 0 ? 1 : 0, up: 0 }, tf = null;
    if (toss) {
      /* la dernière frite : 0 – 0,12 s il la pince, 0,12 – 0,3 s coup de tête, elle monte en tournant ; la tête se renverse,
         le bec s'ouvre en grand vers nous ; vers 1 s elle retombe dedans, GLOUPS ; puis le rot */
      var q = toss.t += dt, gx = Math.cos(B.a), gy = Math.sin(B.a), U = GULL, sc = SC * GS;
      function headU(nk) { return U.chest + U.neckL + U.hx * 0.6 + (U.neckL + 4.2) * nk; }
      var AIR0 = 0.24, AIR = 0.78, upA = clamp((q - 0.3) / 0.22, 0, 1) * (1 - clamp((q - AIR0 - AIR - 0.05) / 0.25, 0, 1));
      GP.neck = q < 0.12 ? 1 : q < AIR0 ? 1 - (q - 0.12) / (AIR0 - 0.12) * 0.6 : 0.4 - 0.2 * upA; GP.beak = q < 0.12 ? 0 : q < AIR0 ? 0 : upA; GP.up = upA; GP.look = 0;
      var tipU = headU(1) + U.hx * 0.8 + U.bl, mouthU = headU(0.2) + U.hx * 0.15;
      if (q < AIR0) { var kk = q < 0.12 ? 0 : (q - 0.12) / (AIR0 - 0.12); tf = { u: tipU - kk * 3, h: kk * 6, a: B.a + Math.PI / 2 }; }          // pincée au bout du bec
      else if (q < AIR0 + AIR) { var tau = (q - AIR0) / AIR; tf = { u: tipU - 3 + (mouthU - tipU + 3) * tau, h: 6 + 150 * tau * (1 - tau) - 6 * tau, a: B.a + Math.PI / 2 + toss.spin * (q - AIR0) }; }
      if (q >= AIR0 && toss.snd === 0) { toss.snd = 1; tone(300, 900, 0.18, 'triangle', 0.05); }                            // hop
      if (q >= AIR0 + AIR && toss.snd === 1) { toss.snd = 2; tone(520, 160, 0.16, 'square', 0.07); tone(240, 120, 0.12, 'sine', 0.06, 0.06); }   // GLOUPS
      if (q >= AIR0 + AIR + 0.35 && toss.snd === 2) { toss.snd = 3; burp = 1; tone(140, 70, 0.45, 'sawtooth', 0.08); }                       // le rot
      if (q > 3) toss = null;
      if (tf) { tf.x = B.x + gx * tf.u * sc; tf.y = B.y + gy * tf.u * sc; }
    }
    drawGull(B.x, B.y, B.a, GP, true);
    if (tf) {                                                                       // la frite en l'air : plus haut = plus grosse, son ombre reste au sol
      var hgt = Math.max(0, tf.h), zoom = 1 + hgt / 70, Lf = toss.l * SC * zoom, oy = -hgt * 0.35 * SC, fc = Math.cos(tf.a), fs = Math.sin(tf.a), kq;
      if (hgt > 2) { g.fillStyle = 'rgba(40,24,70,' + (0.3 * (1 - hgt / 120)).toFixed(2) + ')'; for (kq = 0; kq < toss.l * SC; kq++) g.fillRect(Math.round(tf.x + (kq - toss.l * SC / 2) * fc) + 3, Math.round(tf.y + (kq - toss.l * SC / 2) * fs) + 4, 2, 2); }
      var th2 = Math.max(2, Math.round(2 * zoom));
      for (kq = 0; kq < Lf; kq++) { g.fillStyle = '#7a4a10'; g.fillRect(Math.round(tf.x + (kq - Lf / 2) * fc) - 1, Math.round(tf.y + oy + (kq - Lf / 2) * fs) - 1, th2 + 2, th2 + 2); }
      for (kq = 0; kq < Lf; kq++) { g.fillStyle = kq < 2 * zoom || kq > Lf - 2 * zoom ? '#d99a2a' : '#ffd23f'; g.fillRect(Math.round(tf.x + (kq - Lf / 2) * fc), Math.round(tf.y + oy + (kq - Lf / 2) * fs), th2, th2); }
    }
    for (i = crumbs.length - 1; i >= 0; i--) {                                     // les miettes, et les taps à côté
      var c = crumbs[i]; c.t += dt; if (c.t > (c.miss ? 0.3 : 0.4)) { crumbs.splice(i, 1); continue; }
      if (c.miss) { var rr = (3 + c.t * 30) * SC; g.fillStyle = 'rgba(255,84,112,' + (1 - c.t / 0.3).toFixed(2) + ')'; for (var a = 0; a < 12; a++) g.fillRect(Math.round(c.x + Math.cos(a / 12 * TAU) * rr), Math.round(c.y + Math.sin(a / 12 * TAU) * rr), 1, 1); continue; }
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.9; c.vy *= 0.9;
      g.fillStyle = '#e8b54a'; g.fillRect(Math.round(c.x), Math.round(c.y), 2, 2);
    }
    lightFront(); nightPost();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pc, 0, 0, PW * NPX, PH * NPX);
    if (burp > 0) {                                                                // BURP
      burp = Math.max(0, burp - dt * 0.6);
      ctx.font = Math.round(W / 14) + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      var bxp = clamp((B.x + Math.cos(B.a) * 20 * SC * GS) * NPX, W * 0.2, W * 0.8), byp = (B.y - 22 * SC) * NPX - (1 - burp) * W * 0.08;
      ctx.globalAlpha = Math.min(1, burp * 2); ctx.fillStyle = OUT; ctx.fillText('BURP !', bxp + 3, byp + 3); ctx.fillStyle = '#ffd05a'; ctx.fillText('BURP !', bxp, byp); ctx.globalAlpha = 1;
    }
    if (warnT > 0 && state === 'run') {                                           // le rappel de la règle, quand un tap est refusé
      warnT -= dt;
      ctx.font = Math.round(W / 24) + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      var wy = (T.y - 34 * SC) * NPX; ctx.globalAlpha = Math.min(1, warnT * 3);
      ctx.fillStyle = OUT; ctx.fillText('UN SEUL DOIGT !', W / 2 + 2, wy + 2); ctx.fillStyle = '#4fe8e2'; ctx.fillText('UN SEUL DOIGT !', W / 2, wy); ctx.globalAlpha = 1;
    }
    if (state === 'ready' && Math.floor(clock * 2.4) % 3) {
      ctx.font = Math.round(W / 26) + 'px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = OUT; ctx.fillText('TAPE DANS LA BARQUETTE', W / 2 + 2, (T.y + 30 * SC) * NPX + 2); ctx.fillStyle = '#ffffff'; ctx.fillText('TAPE DANS LA BARQUETTE', W / 2, (T.y + 30 * SC) * NPX);
    }
  }
  function start() { applyPal(); resize(); setUi('menu'); if (best) $('verdict').innerHTML = 'TON RECORD : <b>' + fr(best / 1000, 3) + ' S</b><br>50 FRITES, TAPE DANS LA BARQUETTE.'; last = performance.now(); requestAnimationFrame(frame); }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
</body>
</html>
